name: Build and Release Smart Canteen APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-android:
    name: Build Smart Canteen APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses and Install Build Tools
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools" || true


      - name: Prebuild Android Project
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.CANTEEN_API_URL }}
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd mobile
          npm install

          # Write mobile-config.json with the live Vercel URL from GitHub secret
          CANTEEN_URL="${{ secrets.CANTEEN_API_URL }}"
          if [ -n "$CANTEEN_URL" ]; then
            echo "{\"appUrl\":\"$CANTEEN_URL\",\"appName\":\"CampusBite\",\"version\":\"1.0.0\"}" > ../mobile-config.json
            echo "✅ Wrote mobile-config.json with URL: $CANTEEN_URL"
          else
            echo "⚠️  CANTEEN_API_URL secret not set — using existing mobile-config.json"
          fi

          echo "EXPO_PUBLIC_API_BASE_URL=${{ secrets.CANTEEN_API_URL }}" > .env
          npx expo prebuild --platform android --clean

          sed -i 's/kotlinVersion = "1.9.24"/kotlinVersion = "1.9.25"/g' android/build.gradle || true
          sed -i "s/kotlin_version = '1.9.24'/kotlin_version = '1.9.25'/g" android/build.gradle || true
          echo "kotlin.version=1.9.25" >> android/gradle.properties
          echo "android.suppressKotlinVersionCompatibilityCheck=1.9.25" >> android/gradle.properties

          cat >> android/app/proguard-rules.pro << 'PROGUARD'
          -keep class com.facebook.react.** { *; }
          -keep class com.facebook.hermes.** { *; }
          -keep class com.facebook.jni.** { *; }
          -keep class expo.** { *; }
          -keep class host.exp.** { *; }
          -keep class com.swmansion.** { *; }
          -dontwarn com.facebook.react.**
          -dontwarn expo.**
          PROGUARD

          sed -i '/buildTypes {/,/}/ s/minifyEnabled true/minifyEnabled false/' android/app/build.gradle || true

      - name: Build Release APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd mobile/android
          chmod +x gradlew

          # Ensure release build uses debug signing config if not specified
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' app/build.gradle || true
          sed -i '/buildTypes {/,/}/ s/minifyEnabled true/minifyEnabled false/' app/build.gradle || true

          ./gradlew assembleRelease \
            -PkotlinVersion=1.9.25 \
            -Pkotlin.version=1.9.25 \
            --stacktrace

      - name: Sign and Package APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd mobile/android

          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find app/build/outputs/ -name "*.apk" 2>/dev/null | head -n 1)
          fi
          echo "Found raw APK: $RAW_APK"
          if [ -z "$RAW_APK" ]; then
            echo "ERROR: No APK found after build!"
            exit 1
          fi

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          echo "Build tools: $BUILD_TOOLS_DIR"

          KEYSTORE_PATH="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # If the APK is already signed and aligned by Gradle, verify directly
          if $BUILD_TOOLS_DIR/apksigner verify "$RAW_APK" >/dev/null 2>&1; then
            echo "APK is already signed by Gradle!"
            cp "$RAW_APK" ../../Smart-Canteen.apk
          else
            echo "Signing APK with apksigner..."
            $BUILD_TOOLS_DIR/zipalign -p -f 4 "$RAW_APK" app-aligned.apk
            $BUILD_TOOLS_DIR/apksigner sign \
              --ks "$KEYSTORE_PATH" \
              --ks-pass pass:android \
              --ks-key-alias androiddebugkey \
              --key-pass pass:android \
              --out ../../Smart-Canteen.apk \
              app-aligned.apk
          fi

          $BUILD_TOOLS_DIR/apksigner verify -v ../../Smart-Canteen.apk
          ls -lh ../../Smart-Canteen.apk
          echo "Smart-Canteen.apk ready and verified!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Canteen-APK
          path: Smart-Canteen.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Smart Canteen ${{ github.ref_name || github.event.inputs.version }}
          tag_name: ${{ github.ref_name || github.event.inputs.version }}
          files: Smart-Canteen.apk
          draft: false
          prerelease: false
          body: |
            ## Smart College Canteen Android App

            Download Smart-Canteen.apk and install on any Android 8.0+ device.

            Install Steps:
            1. Download Smart-Canteen.apk
            2. Phone Settings > Security > Allow Unknown Apps
            3. Open the APK file and tap Install
            4. Open Smart Canteen from your app drawer
